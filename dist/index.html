le:"Safety Verification",description:"Combustion analysis, airflow test, and complete controls walkthrough."}],gallery:[{image:Ve(6471911,1e3,800),title:"Precision diagnostics",description:"Accurate readings before any recommendation."},{image:Ve(6471912,1e3,800),title:"System calibration",description:"Refrigerant and pressure checks performed to specification."},{image:Ve(6471913,1e3,800),title:"Final electrical test",description:"Every connection verified for safe operation."}],outcome:"Reliable heat, even room temperatures, and full confidence in your system's safety.",faqs:[{question:"Should I choose a furnace or a heat pump?",answer:"It depends on your climate, fuel costs, existing ductwork, and efficiency goals. We model both options and explain the tradeoffs so you can choose with confidence."},{question:"What counts as a heating emergency?",answer:"No heat during cold weather, gas odor, carbon-monoxide alarms, repeated breaker trips, or unusual burner noise. Call BOSS immediately and leave the property if you smell gas."},{question:"How often should a furnace be inspected?",answer:"Once a year before winter. Annual service verifies combustion safety, cleans critical components, and catches wear before it becomes a mid-season failure."},{question:"Can you help with rebates?",answer:"Yes. We identify available utility and manufacturer incentives, prepare the required documentation, and include eligible savings in your quote."}]},{slug:"indoor-air-quality",eyebrow:"Indoor Air Quality",title:"Air That Feels Genuinely Clean",shortTitle:"Indoor Air Quality",heroText:"Advanced filtration, balanced ventilation, humidity control, and sealed ductwork—designed to make the air inside your space as considered as the temperature.",heroImage:Ve(11538226,1800,1050),overviewLabel:"The Hidden Half of Comfort",overviewTitle:"Comfort is not just temperature. It is what you breathe.",overviewText:"Dust, pollen, excess humidity, volatile compounds, and leaky ducts can circulate t
